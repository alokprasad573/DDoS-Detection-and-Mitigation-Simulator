name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Pre-Deployment Validation (Ensures clean builds before triggering deploy)
  # ============================================================================
  validate:
    name: Build & Validate Release Candidates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e "backend[dev]"

      - name: Run Backend Lint
        run: python -m ruff check backend

      - name: Run Backend Tests
        env:
          DATABASE_URL: sqlite:///./sentrix_test.db
          API_AUTH_REQUIRED: "true"
          API_AUTH_TOKEN: test-token-sentrix
        run: python -m pytest backend/tests -q

      - name: Set up Node.js 24 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Run Frontend Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Compile Next.js Production Bundle
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_USE_PROXY: "true"
          API_AUTH_TOKEN: test-build-token
        run: npm run build

  # ============================================================================
  # 2. Trigger Cloud Deployments (Render Backend & Vercel Frontend)
  # ============================================================================
  deploy:
    name: Trigger Cloud Deployments (Render & Vercel)
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Render Backend Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            if [[ "$DEPLOY_HOOK" == *"onrender.com"* && "$DEPLOY_HOOK" != *"api.render.com"* ]]; then
              echo "::warning::RENDER_DEPLOY_HOOK_URL is set to an onrender.com app URL instead of a Render Deploy Hook (https://api.render.com/deploy/srv-...). Skipping webhook. Render auto-deploys via Git on push."
            else
              echo "Triggering Render backend deploy webhook..."
              curl -fsS -X POST "$DEPLOY_HOOK"
              echo "Render backend deploy hook triggered successfully."
            fi
          else
            echo "RENDER_DEPLOY_HOOK_URL not configured. Render automatic Git deploys will take effect on push to main."
          fi

      - name: Trigger Vercel Frontend Deploy Hook
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_HOOK" ]; then
            if [[ "$VERCEL_HOOK" == *"vercel.app"* && "$VERCEL_HOOK" != *"api.vercel.com"* ]]; then
              echo "::warning::VERCEL_DEPLOY_HOOK_URL is set to a vercel.app site URL instead of a Vercel Deploy Hook (https://api.vercel.com/...). Skipping webhook. Vercel auto-deploys via Git on push."
            else
              echo "Triggering Vercel frontend deploy webhook..."
              curl -fsS -X POST "$VERCEL_HOOK"
              echo "Vercel frontend deploy hook triggered successfully."
            fi
          else
            echo "VERCEL_DEPLOY_HOOK_URL not configured. Vercel automatic Git deploys will take effect on push to main."
          fi

  # ============================================================================
  # 3. Post-Deployment Smoke Test
  # ============================================================================
  smoke-test:
    name: Production Health Verification
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Live Production Backend Health Endpoint
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
        run: |
          if [ -n "$PROD_API_URL" ]; then
            echo "Verifying live Render backend health..."
            curl -fsS "$PROD_API_URL/healthz"
            echo "Render backend health check verified."
          else
            echo "PROD_API_URL secret not set. Skipping post-deploy remote ping."
          fi
