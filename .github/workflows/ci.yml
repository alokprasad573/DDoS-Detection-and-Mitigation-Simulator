name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Backend CI Pipeline (Python 3.11 + FastAPI + ML Detection Tests)
  # ============================================================================
  backend:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e "backend[dev]"

      - name: Run Ruff Linter & Formatting Check
        run: python -m ruff check backend

      - name: Execute Pytest Test Suite
        env:
          DATABASE_URL: sqlite:///./sentrix_test.db
          API_AUTH_REQUIRED: "true"
          API_AUTH_TOKEN: test-token-sentrix
        run: python -m pytest backend/tests -v

  # ============================================================================
  # 2. Frontend CI Pipeline (Node.js 20 + Next.js 16 + TypeScript Compilation)
  # ============================================================================
  frontend:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Build Next.js Production Artifacts
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_USE_PROXY: "true"
          API_AUTH_TOKEN: test-build-token
        run: npm run build
